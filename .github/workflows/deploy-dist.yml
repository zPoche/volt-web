name: Build & commit dist

on:
  push:
    branches: [main]
  workflow_dispatch:

# Verhindert Endlosschleife bei dist-only Commits
concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit dist/ into main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update production dist/'
          file_pattern: 'dist'
          skip_dirty_check: false

      - name: Pack zip artifact
        run: (cd dist && zip -r ../volt-web-dist.zip .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-web-dist
          path: volt-web-dist.zip
          retention-days: 30
