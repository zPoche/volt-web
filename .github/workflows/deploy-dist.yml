name: Build deploy package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist zip
        run: |
          (cd dist && zip -r ../volt-web-dist.zip .)
          ls -lh volt-web-dist.zip

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-web-dist
          path: volt-web-dist.zip
          retention-days: 30

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: Deploy package #${{ github.run_number }}
          body: |
            Fertiges Plesk-Paket: `volt-web-dist.zip`

            1. ZIP herunterladen
            2. In Plesk `httpdocs` leeren (altes `src/` weg)
            3. ZIP-Inhalt entpacken
          files: volt-web-dist.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
