<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Volt — modulares ERP für Elektrohandwerk. Projekte, Plantafel, MonteurHub, PV & Wärmepumpe, eRechnung, Fahrtenbuch und lokale KI in einem System."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <!-- Gleicher Blitz wie Volt ERP (apps/frontend/public/favicon.svg) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Volt — ERP für Elektrohandwerk</title>
    <style>
      /* Sofort-Splash vor React — gleiche Blitz-Animation wie blitz.html */
      #volt-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        transition: opacity 0.32s ease;
      }
      #volt-splash.volt-splash--hide {
        opacity: 0;
        pointer-events: none;
      }
      #volt-splash .bolt-track {
        fill: none;
        stroke: rgba(45, 212, 191, 0.16);
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #volt-splash .bolt-glow {
        fill: none;
        stroke: #2dd4bf;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#volt-splash-glow);
      }
    </style>
  </head>
  <body>
    <div id="volt-splash" aria-busy="true" aria-label="Volt wird geladen">
      <svg width="120" height="120" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <filter id="volt-splash-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.6" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <path class="bolt-track" d="M13 2 L4.5 13.5 H11.5 L11 22 L19.5 10.5 H12.5 Z" />
        <path class="bolt-glow" id="volt-splash-bolt" d="M13 2 L4.5 13.5 H11.5 L11 22 L19.5 10.5 H12.5 Z" />
      </svg>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('volt-splash');
        var p = document.getElementById('volt-splash-bolt');
        var hiding = false;

        window.__voltHideSplash = function () {
          if (hiding || !splash) return;
          hiding = true;
          splash.classList.add('volt-splash--hide');
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            window.__VOLT_SPLASH_DONE__ = true;
          }, 320);
        };

        /* Failsafe für Plesk: Splash nie ewig — auch wenn JS-Bundle/Fonts hängen */
        window.setTimeout(function () {
          window.__voltHideSplash();
        }, 2500);

        if (!p || !p.getTotalLength) return;
        var total = p.getTotalLength();
        var dot = 6;
        var gap = total - 8;
        var period = dot + gap;
        p.style.strokeDasharray = dot + ' ' + gap;
        var duration = 2000;
        var start = null;
        function tick(ts) {
          if (!document.getElementById('volt-splash')) return;
          if (start === null) start = ts;
          var elapsed = (ts - start) % duration;
          p.style.strokeDashoffset = period - (elapsed / duration) * period;
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>

    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Volt benötigt JavaScript. Bitte lade den Inhalt des
        <code>dist</code>-Ordners nach dem Build hoch
        (<code>pnpm build</code>).
      </p>
    </noscript>
    <!-- Vite ersetzt diesen Tag im Build durch ./assets/index-….js -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Wenn jemand das Repo-Root statt dist/ auf Plesk legt → klare Meldung statt Weiß */
      (function () {
        function showDeployHint() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var hasBuiltBundle = !!document.querySelector('script[src*="assets/"]');
          if (hasBuiltBundle) return;
          if (typeof window.__voltHideSplash === 'function') window.__voltHideSplash();
          root.innerHTML =
            '<div style="max-width:36rem;margin:4rem auto;padding:1.5rem;font-family:system-ui,sans-serif;color:#f1f5f9;background:#0f172a;border:1px solid #334155;border-radius:0.75rem;line-height:1.5">' +
            '<strong style="color:#2dd4bf">Volt — falscher Document Root</strong>' +
            '<p style="margin:0.75rem 0 0;color:#94a3b8">Apache liefert die Quell-<code>index.html</code> statt <code>dist/</code>.</p>' +
            '<ol style="margin:0.75rem 0 0;padding-left:1.25rem;color:#cbd5e1">' +
            '<li>Plesk → Document Root auf <code>httpdocs/dist</code> setzen</li>' +
            '<li><strong>oder</strong> Git-Zusatzaktion: <code>bash scripts/plesk-publish-dist.sh</code></li>' +
            '<li>Details: <code>PLESK.md</code> im Repo</li>' +
            '</ol></div>';
        }
        window.addEventListener('load', function () {
          window.setTimeout(showDeployHint, 1200);
        });
      })();
    </script>
  </body>
</html>
